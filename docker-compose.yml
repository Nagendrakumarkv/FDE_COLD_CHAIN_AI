
services:
  postgres:
    image: postgres:17
    container_name: cold-chain-postgres
    environment:
      POSTGRES_DB: cold_chain
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma
    container_name: cold-chain-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/data

volumes:
  postgres_data:
  chroma_data:
